name: Helpe
options:
  bundleIdPrefix: local.helpe
  deploymentTarget:
    iOS: "16.0"
targets:
  Helpe:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Helpe
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.helpe.app
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
